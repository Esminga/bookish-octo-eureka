<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esercizio Note e Durate</title>
    <style>
        /* CSS Integrato */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        .container { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); max-width: 550px; width: 100%; text-align: center; }
        h1 { color: #2980b9; margin-bottom: 20px; font-size: 1.5rem; }
        .staff-container { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 25px; padding: 10px; background: #fefefe; }
        #staff { max-width: 100%; height: 200px; }
        #feedback { font-size: 1.2rem; font-weight: bold; min-height: 25px; margin-bottom: 20px; }
        .correct { color: #2ecc71; }
        .incorrect { color: #e74c3c; }
        .answers { display: flex; justify-content: space-between; gap: 15px; }
        .answer-group { flex: 1; min-width: 200px; text-align: left; }
        .answer-group h3 { font-size: 1rem; color: #34495e; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 10px; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-grid.note-names { grid-template-columns: repeat(4, 1fr); }
        .btn-grid.durations { grid-template-columns: repeat(2, 1fr); }
        .answer-btn { padding: 10px 5px; font-size: 0.9rem; border: 2px solid #3498db; background: white; color: #3498db; border-radius: 6px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .answer-btn:hover { background: #3498db; color: white; }
        .answer-btn.selected { background: #e67e22; color: white; border-color: #e67e22; }
        #checkBtn { padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; transition: background 0.2s; margin-top: 20px; }
        #checkBtn:hover { background: #27ae60; }
        .reset-btn { margin-top: 15px; padding: 8px 15px; background: #95a5a6; color: white; border: none; border-radius: 4px; cursor: pointer; }

        @media (max-width: 600px) {
            .answers { flex-direction: column; }
            .answer-group { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Identifica Nota e Durata 🎼</h1>
        
        <div class="staff-container">
            <svg id="staff" width="400" height="200" viewBox="0 0 400 200">
                </svg>
        </div>

        <div id="feedback"></div>

        <div class="answers">
            <div class="answer-group">
                <h3>Nome della Nota</h3>
                <div class="btn-grid note-names" id="noteNameBtns">
                    </div>
            </div>

            <div class="answer-group">
                <h3>Durata (Figura Musicale)</h3>
                <div class="btn-grid durations" id="durationBtns">
                    </div>
            </div>
        </div>

        <button id="checkBtn">Verifica Risposta</button>
        <button id="resetBtn" class="reset-btn">Prossima Nota</button>
    </div>

    <script>
class MusicalFlashCards {
    constructor() {
        // Mappatura delle note (C4-A5) con coordinate SVG Y (valori Y in base al rendering)
        this.notePositions = {
            'C4': 140, // Do centrale (Linea addizionale a 150, la nota va a 140)
            'D4': 130, // Re (sotto la 1a linea)
            'E4': 120, // 1a linea (Mi)
            'F4': 110, // 1° spazio (Fa)
            'G4': 100, // 2a linea (Sol)
            'A4': 90,  // 2° spazio (La)
            'B4': 80,  // 3a linea (Si)
            'C5': 70,  // 3° spazio (Do)
            'D5': 60,  // 4a linea (Re)
            'E5': 50,  // 4° spazio (Mi)
            'F5': 40,  // 5a linea (Fa)
            'G5': 30,  // Sol (sopra la 5a linea)
            'A5': 20   // La (1a linea addizionale sopra)
        };
        
        // Mappatura delle figure musicali
        this.durations = {
            'semibreve': { name: 'Semibreve', filled: false, stem: false, flags: 0, beats: 4 },
            'minima': { name: 'Minima', filled: false, stem: true, flags: 0, beats: 2 },
            'semiminima': { name: 'Semiminima', filled: true, stem: true, flags: 0, beats: 1 },
            'croma': { name: 'Croma', filled: true, stem: true, flags: 1, beats: 0.5 }
        };

        this.currentNoteWithOctave = null;
        this.currentDurationType = null;
        this.selectedNote = null;
        this.selectedDuration = null;

        this.setupButtons();
        this.generateNewNote();
    }

    // --- SETUP UI e Interazione ---

    setupButtons() {
        const noteNames = ['Do', 'Re', 'Mi', 'Fa', 'Sol', 'La', 'Si'];
        const durationNames = Object.values(this.durations).map(d => d.name);
        const noteMap = { 'Do': 'C', 'Re': 'D', 'Mi': 'E', 'Fa': 'F', 'Sol': 'G', 'La': 'A', 'Si': 'B' };

        // Crea i pulsanti per i nomi delle note
        const noteBtnContainer = document.getElementById('noteNameBtns');
        noteNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn note-btn';
            btn.textContent = name;
            // CORREZIONE: Mappatura sicura del nome italiano (Do) al codice interno (C)
            btn.dataset.value = noteMap[name]; 
            btn.addEventListener('click', () => this.selectAnswer(btn, 'note'));
            noteBtnContainer.appendChild(btn);
        });

        // Crea i pulsanti per le durate
        const durationBtnContainer = document.getElementById('durationBtns');
        durationNames.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn duration-btn';
            btn.textContent = name;
            const key = Object.keys(this.durations).find(k => this.durations[k].name === name);
            btn.dataset.value = key;
            btn.addEventListener('click', () => this.selectAnswer(btn, 'duration'));
            durationBtnContainer.appendChild(btn);
        });

        // Setup pulsanti Verifica e Reset
        document.getElementById('checkBtn').addEventListener('click', () => this.checkAnswer());
        document.getElementById('resetBtn').addEventListener('click', () => this.generateNewNote());
    }

    selectAnswer(button, type) {
        // Deseleziona tutti gli altri pulsanti dello stesso tipo
        document.querySelectorAll(`.${type}-btn`).forEach(btn => btn.classList.remove('selected'));
        
        // Seleziona il pulsante cliccato
        button.classList.add('selected');

        // Aggiorna le selezioni
        if (type === 'note') {
            this.selectedNote = button.dataset.value;
        } else if (type === 'duration') {
            this.selectedDuration = button.dataset.value;
        }
    }

    // --- LOGICA DEL GIOCO ---

    generateNewNote() {
        const noteKeys = Object.keys(this.notePositions);
        const durationKeys = Object.keys(this.durations);

        // Seleziona una nota casuale (con ottava)
        const randomNoteKey = noteKeys[Math.floor(Math.random() * noteKeys.length)];
        this.currentNoteWithOctave = randomNoteKey;

        // Estrai il nome della nota (es. 'C' da 'C4')
        const noteName = randomNoteKey.charAt(0);
        this.currentNoteName = noteName;
        
        // Seleziona una durata casuale
        this.currentDurationType = durationKeys[Math.floor(Math.random() * durationKeys.length)];

        // Disegna la nuova nota sul pentagramma
        this.drawStaffAndNote(randomNoteKey, this.currentDurationType);

        // Resetta feedback e selezioni
        document.getElementById('feedback').textContent = "Seleziona il nome della nota e la sua durata.";
        document.getElementById('feedback').className = 'feedback';
        this.selectedNote = null;
        this.selectedDuration = null;
        document.querySelectorAll('.answer-btn').forEach(btn => btn.classList.remove('selected'));
    }

    checkAnswer() {
        const feedback = document.getElementById('feedback');

        if (!this.selectedNote || !this.selectedDuration) {
            feedback.textContent = "Devi selezionare sia il nome che la durata!";
            feedback.className = 'feedback incorrect';
            return;
        }

        // Estrai l'iniziale (C, D, E...) della risposta corretta
        const correctNoteInitial = this.currentNoteName; 
        const correctDuration = this.currentDurationType;

        const isNoteCorrect = this.selectedNote === correctNoteInitial;
        const isDurationCorrect = this.selectedDuration === correctDuration;

        if (isNoteCorrect && isDurationCorrect) {
            feedback.textContent = "🥳 Corretto! Hai indovinato sia la nota che la durata.";
            feedback.className = 'feedback correct';
            setTimeout(() => this.generateNewNote(), 1500); 
        } else {
            let msg = "Riprova. ";
            if (!isNoteCorrect) msg += `Nome della nota sbagliato (era ${this.getNameFromInitial(correctNoteInitial)}). `;
            if (!isDurationCorrect) msg += `Durata sbagliata (era ${this.durations[correctDuration].name}).`;
            
            feedback.textContent = msg;
            feedback.className = 'feedback incorrect';
        }
    }

    getNameFromInitial(initial) {
        const map = { 'C': 'Do', 'D': 'Re', 'E': 'Mi', 'F': 'Fa', 'G': 'Sol', 'A': 'La', 'B': 'Si' };
        return map[initial] || initial;
    }


    // --- FUNZIONI DI DISEGNO SVG ---

    drawStaffAndNote(noteWithOctave, durationType) {
        const svg = document.getElementById('staff');
        svg.innerHTML = ''; // Pulisce il contenuto precedente

        // Costanti di disegno
        const staffYStart = 40; // La linea più in alto del pentagramma (F5)
        const lineSpacing = 20;
        const noteX = 250; 
        const svgWidth = 400;

        // 1. Disegna le 5 linee del pentagramma
        for (let i = 0; i < 5; i++) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            const y = staffYStart + (i * lineSpacing);
            line.setAttribute('x1', '50');
            line.setAttribute('y1', y);
            line.setAttribute('x2', svgWidth - 50);
            line.setAttribute('y2', y);
            line.setAttribute('stroke', '#333');
            line.setAttribute('stroke-width', '2');
            svg.appendChild(line);
        }

        // 2. Disegna la Chiave di Violino (G-Clef: 𝄞)
        const clefText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        clefText.setAttribute('x', '65');
        clefText.setAttribute('y', staffYStart + (lineSpacing * 3.75)); // Posiziona in base alla linea del Sol (G4)
        clefText.setAttribute('font-size', '140');
        clefText.setAttribute('font-family', 'serif');
        clefText.textContent = '𝄞'; 
        svg.appendChild(clefText);

        // 3. Calcola la posizione Y della nota (Direttamente dal valore della mappatura)
        const yPosition = this.notePositions[noteWithOctave];
        
        // 4. Disegna le linee addizionali (ledger lines) se necessarie
        const firstLineY = 40; // La linea F5
        const middleCY = 140; // La linea del Do centrale

        // Linee addizionali SUPERIORI (G5, A5)
        if (yPosition < firstLineY) {
            for (let y = firstLineY - lineSpacing; y >= yPosition; y -= lineSpacing) {
                if (y < firstLineY) {
                    this.drawLedgerLine(svg, noteX, y);
                }
            }
        }

        // Linee addizionali INFERIORI (C4, D4)
        if (yPosition >= middleCY) {
            this.drawLedgerLine(svg, noteX, middleCY); // Disegna la linea per il Do centrale
        } 
        
        // 5. Disegna la nota
        const duration = this.durations[durationType];
        this.drawNoteHead(svg, noteX, yPosition, duration);

        // 6. Disegna il gambo e le bandiere
        if (duration.stem) {
            const stemUp = yPosition > 80; // Gambo in su sotto la 3a linea (Si), in giù sopra
            this.drawStem(svg, noteX, yPosition, stemUp, duration);
        }
    }

    drawLedgerLine(svg, x, y) {
        const ledger = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        ledger.setAttribute('x1', x - 15);
        ledger.setAttribute('y1', y);
        ledger.setAttribute('x2', x + 15);
        ledger.setAttribute('y2', y);
        ledger.setAttribute('stroke', '#333');
        ledger.setAttribute('stroke-width', '2');
        svg.appendChild(ledger);
    }

    drawNoteHead(svg, x, y, duration) {
        const note = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        note.setAttribute('cx', x);
        note.setAttribute('cy', y);
        note.setAttribute('rx', duration.name === 'Semibreve' ? '14' : '12'); 
        note.setAttribute('ry', '9');
        note.setAttribute('fill', duration.filled ? '#333' : 'none');
        note.setAttribute('stroke', '#333');
        note.setAttribute('stroke-width', duration.filled ? '0' : '3');
        note.setAttribute('transform', `rotate(-20 ${x} ${y})`);
        svg.appendChild(note);
    }

    drawStem(svg, x, y, stemUp, duration) {
        // La posizione X del gambo dipende dalla sua direzione (su/giù)
        const stemX = stemUp ? x + 12 : x - 12; // Gambo a destra se su, a sinistra se giù
        const stemY2 = stemUp ? y - 60 : y + 60; // Estremità superiore/inferiore del gambo

        const stem = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        stem.setAttribute('x1', stemX);
        stem.setAttribute('y1', y);
        stem.setAttribute('x2', stemX);
        stem.setAttribute('y2', stemY2);
        stem.setAttribute('stroke', '#333');
        stem.setAttribute('stroke-width', '3');
        svg.appendChild(stem);

        // CORREZIONE DEFINITIVA: Disegno della bandiera per la Croma (flags=1)
        if (duration.flags > 0) {
            const flagStartX = stemX;
            const flagStartY = stemY2;
            
            let pathData = '';
            
            if (stemUp) { 
                // GAMBO IN SU: Coda a DESTRA, parte dall'alto del gambo
                pathData = `M ${flagStartX} ${flagStartY} 
                            C ${flagStartX + 18} ${flagStartY + 10}, 
                              ${flagStartX + 18} ${flagStartY + 30}, 
                              ${flagStartX} ${flagStartY + 35}`;
            } else { 
                // GAMBO IN GIÙ: Coda a DESTRA, parte dall'alto del gambo (in basso sulla pagina)
                // Il punto di controllo spinge la curva a SINISTRA/ESTERNO
                pathData = `M ${flagStartX} ${flagStartY} 
                            C ${flagStartX - 18} ${flagStartY - 10}, 
                              ${flagStartX - 18} ${flagStartY - 30}, 
                              ${flagStartX} ${flagStartY - 35}`;
            }
            
            const flag = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            flag.setAttribute('d', pathData);
            flag.setAttribute('stroke', '#333');
            flag.setAttribute('stroke-width', '3');
            flag.setAttribute('fill', 'none');
            svg.appendChild(flag);
        }
    }
}

// Inizializza l'app al caricamento della pagina
document.addEventListener('DOMContentLoaded', () => {
    new MusicalFlashCards();
});
    </script>
</body>
</html>
